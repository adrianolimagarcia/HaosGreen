# HaosGreen Configuration

[telegram]
# Get your bot token from @BotFather on Telegram
bot_token = "YOUR_TELEGRAM_BOT_TOKEN"
# Only these Telegram user IDs can interact with the bot
# Find your user ID by messaging @userinfobot on Telegram
allowed_user_ids = [123456789]

[openrouter]
# Get your API key from https://openrouter.ai/keys
api_key = "YOUR_OPENROUTER_API_KEY"
# Model to use (see https://openrouter.ai/models)
model = "moonshotai/kimi-k2.6"
# API base URL (usually no need to change)
base_url = "https://openrouter.ai/api/v1"
# Alternative using local ollama
# base_url = "http://localhost:11434/v1"
# Maximum tokens in response
max_tokens = 4096
# supports_vision = false  # Set to true if your model supports image inputs
# System prompt for the AI assistant
system_prompt = """You are a helpful AI assistant with access to tools. \
Use the available tools to help the user with their tasks. \
When using file or terminal tools, operate only within the allowed sandbox directory. \
Be concise and helpful."""

# ── Multi-Provider Configuration (optional) ────────────────────────────
# Define additional LLM providers alongside OpenRouter.
# Each [[provider]] block adds a new provider. Model strings use the
# format `provider_name/model_id` (e.g., `ollama/llama3.1`).
# The first provider becomes the default.

# Example: Ollama (local models)
# [[provider]]
# name = "ollama"
# type = "ollama"
# base_url = "http://localhost:11434/v1"
# model = "llama3.1"
# discover_models = true

# Example: Any OpenAI-compatible endpoint (LM Studio, vLLM, llama.cpp, etc.)
# [[provider]]
# name = "lmstudio"
# type = "openai_compatible"
# base_url = "http://localhost:1234/v1"
# model = "qwen2.5-7b-instruct"

# ── Fallback Chain (optional) ──────────────────────────────────────────
# When the primary model fails, HaosGreen tries each fallback in order.
# Each entry is a full provider-prefixed model string.
# [fallback]
# chain = [
#     "openrouter/moonshotai/kimi-k2.6",
#     "ollama/llama3.1",
#     "lmstudio/qwen2.5-7b-instruct",
# ]

# ── Home directory & paths ──────────────────────────────────────────────
# By default HaosGreen stores everything under ~/.haos-green:
#   ~/.haos-green/config.toml, haos-green.db, skills/, agents/, workspace/, artifacts/
# Override the home root with the HAOS_GREEN_HOME env var (absolute path; RUSTFOX_HOME also checked for compatibility) or
# [general].home (see the [general] section below). Run a second isolated
# instance with:
#   HAOS_GREEN_HOME="$HOME/.haos-green-work" cargo run

[sandbox]
# The LLM's persistent workspace (file/command tools are confined here).
# Leave unset to use <home>/workspace. Set an absolute path to override.
# allowed_directory = "/absolute/path/to/workspace"

[memory]
# Path to the SQLite database file for persistent memory
# Stores conversations, knowledge base, and vector embeddings
# Leave unset to use <home>/haos-green.db. Set an absolute path to override.
# database_path = "/absolute/path/to/haos-green.db"

# Query rewriting for memory search (optional; default: false)
# When enabled, ambiguous follow-up questions are rewritten into self-contained
# search queries using an LLM call before the RAG vector search.
# This improves recall accuracy but adds one extra LLM round-trip per message.
# Can also be toggled per-user at runtime via the /query-rewrite Telegram command.
# query_rewriter_enabled = false

[skills]
# Directory containing skill markdown files
# Skills are natural-language instructions loaded at startup
# Leave unset to use <home>/skills (seeded from the bundled skills on first run).
# directory = "/absolute/path/to/skills"

[general]
# Home directory root for all HaosGreen state (optional; overrides ~/.haos-green).
# Must be an absolute path. The HAOS_GREEN_HOME env var takes precedence over this.
# home = "/absolute/path/to/home"

# Your location, injected into the system prompt so the AI knows your timezone/region
# Uncomment and set to your city/region (e.g. "Tokyo, Japan")
# location = "Tokyo, Japan"

# Agent loop (optional; defaults apply if section omitted)
# [agent]
# max_iterations = 25              # Agent loop cap (default 25)
# empty_response_retry_limit = 3   # Recovery attempts for empty model responses (default 3; 0 = fail immediately)
# parse_retry_limit = 3            # Retries when API response is missing 'choices' field (default 3; 0 = fail immediately; exponential backoff: 1s, 2s, 4s...)

# [agent.loop_detection]
# enabled = true          # Detect exact tool-call repetition inside the agent loop (default true)
# threshold = 3           # Repetitions of the same tool+args before a loop is flagged (default 3)
# timeout_seconds = 120   # Idle window for the loop detector; tool calls older than this don't count (default 120)

# LangSmith observability (optional)
# Traces every LLM call and tool execution for debugging in the LangSmith UI.
# Get your API key at https://smith.langchain.com → Settings → API Keys
# [langsmith]
# api_key = "ls__..."
# project = "haos-green"   # LangSmith project name (default: "default")

# Embedding API for vector search (optional)
# When configured, enables hybrid vector + FTS5 search for memory.
# Without this, falls back to FTS5 keyword search only.
# Works with any OpenAI-compatible /v1/embeddings endpoint.
# [embedding]
# api_key = "YOUR_OPENROUTER_API_KEY"
# base_url = "https://openrouter.ai/api/v1"
# model = "qwen/qwen3-embedding-8b"
# dimensions = 1536

# MCP Server Configurations
# Each [[mcp_servers]] block defines an MCP server to connect to
# The bot will discover and register tools from each server

# Example: Git MCP server (requires uvx/npx)
# [[mcp_servers]]
# name = "git"
# command = "uvx"
# args = ["mcp-server-git"]

# Example: Filesystem MCP server
# [[mcp_servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/haos-green-sandbox"]

# Example: Google Workspace MCP server (Gmail, Calendar, Drive, Docs, Sheets, Slides)
# Note: use --from because the package name differs from the executable name
#
# OAuth setup:
#   1. https://console.cloud.google.com/apis/credentials
#      → Create/select project → enable Drive, Gmail, Calendar, Docs, Sheets, Slides APIs
#   2. OAuth consent screen → External → add your email as a test user
#   3. Credentials → Create OAuth Client ID → Web application
#      → add Authorised redirect URI: https://developers.google.com/oauthplayground
#      → save your Client ID and Client Secret
#   4. Open https://developers.google.com/oauthplayground
#      → gear icon → check "Use your own OAuth credentials" → enter Client ID + Secret
#      → add scopes: https://www.googleapis.com/auth/drive
#                    https://www.googleapis.com/auth/gmail.modify
#                    https://www.googleapis.com/auth/calendar
#                    https://www.googleapis.com/auth/documents
#                    https://www.googleapis.com/auth/spreadsheets
#                    https://www.googleapis.com/auth/presentations
#      → "Authorize APIs" → sign in → "Exchange authorization code for tokens"
#      → copy the Refresh token value
#
# [[mcp_servers]]
# name = "google-workspace"
# command = "uvx"
# args = ["--from", "google-workspace-mcp", "google-workspace-worker"]
# [mcp_servers.env]
# GOOGLE_WORKSPACE_CLIENT_ID     = "your-client-id.apps.googleusercontent.com"
# GOOGLE_WORKSPACE_CLIENT_SECRET = "your-client-secret"
# GOOGLE_WORKSPACE_REFRESH_TOKEN = "your-refresh-token"  # from step 4 above
# GOOGLE_WORKSPACE_ENABLED_CAPABILITIES = '["drive","docs","gmail","calendar","sheets","slides"]'

# Example: Meta Threads MCP server (publish posts, read replies, analytics)
#
# Token setup:
#   1. Go to https://developers.facebook.com/apps → Create App → Business type
#      → add the "Threads API" product from the dashboard
#   2. Under Threads API → Permissions → request:
#         threads_basic, threads_content_publish,
#         threads_manage_replies, threads_read_replies
#      Add your Threads account as a Test User under App Roles → Roles
#   3. Under Threads API → Access Tokens → Generate Token for your test user
#      → copy the long-lived token (valid ~60 days; regenerate before expiry)
#
# [[mcp_servers]]
# name = "threads"
# command = "npx"
# args = ["-y", "threads-mcp-server"]
# [mcp_servers.env]
# THREADS_ACCESS_TOKEN = "your-long-lived-access-token"

# Example: Web search MCP server with environment variables
# [[mcp_servers]]
# name = "brave-search"
# command = "npx"
# args = ["-y", "@brave/brave-search-mcp-server"]
# [mcp_servers.env]
# BRAVE_API_KEY = "your-brave-api-key"

# ── HTTP-based MCP Servers (Streamable HTTP transport) ────────────────────────
# These servers are reached over HTTPS and do not require a local command.
# Use `url` instead of `command`; optionally set `auth_token` for Bearer auth.

# Example: Notion MCP server (official HTTP MCP — no Node.js required)
# Docs: https://developers.notion.com/guides/mcp/mcp
#
# Recommended: use the setup wizard (cargo run --bin setup) to obtain an OAuth
# access token via the built-in OAuth 2.0 flow.  The wizard also stores the
# refresh token and expiry so the bot can automatically renew the connection.
#
# The bot refreshes the access token automatically when it is within 5 minutes
# of expiry and writes the new credentials back to this file.  Manual setup:
#   1. Create a Notion integration at https://www.notion.so/my-integrations
#      and note your client_id and client_secret.
#   2. Complete the OAuth flow to obtain an access_token and refresh_token.
#   3. Fill in the fields below.
#
# [[mcp_servers]]
# name = "notion"
# url = "https://mcp.notion.com/mcp"
# auth_token = "your-notion-oauth-access-token"
# refresh_token = "your-notion-oauth-refresh-token"
# token_expires_at = 1234567890          # Unix timestamp; set by the wizard
# token_endpoint = "https://api.notion.com/v1/oauth/token"
# oauth_client_id = "your-notion-client-id"
# oauth_client_secret = "your-notion-client-secret"  # omit for public clients

# Example: Exa AI web search (https://mcp.exa.ai)
# Get your API key at https://dashboard.exa.ai/api-keys
#
# Option A — Bearer token (recommended; keeps the key out of URLs and logs)
# [[mcp_servers]]
# name = "exa"
# url = "https://mcp.exa.ai/mcp"
# auth_token = "your-exa-api-key"
#
# Option B — Inline API key in URL (simpler; key will appear in logs)
# [[mcp_servers]]
# name = "exa"
# url = "https://mcp.exa.ai/mcp?exaApiKey=your-exa-api-key"

# ── Self-Learning (optional; defaults apply if section omitted) ─────────────
# [learning]
# skill_extraction_enabled = true              # Auto-generate skills from tool-heavy tasks
# skill_extraction_threshold = 5              # Min tool calls to trigger extraction
# user_model_update_interval = 10             # Update user model every N user messages
# user_model_cron = "0 0 3 * * SUN"           # Weekly user model refresh (6-field cron)
# compaction_model = "qwen/qwen3-8b"          # Cheaper model for compaction summary + USER.md flush (default: current model)

# ── A2A (Agent2Agent) protocol (optional; DISABLED by default) ──────────────
#
# Lets other A2A agents on your LAN/VPN discover this bot and send it tasks.
# Leave `enabled = false` unless you actually need this: turning it on opens a
# network listener that can drive an agent holding shell access.
#
# [a2a]
# enabled = false                             # Master switch. false = no listener at all.
# bind = "127.0.0.1:8443"                     # Loopback by default. Use "0.0.0.0:8443"
#                                             # for LAN/VPN -- but read the note below first.
# public_url = "http://192.168.1.50:8443"     # What the Agent Card advertises. Needed when
#                                             # binding 0.0.0.0 or sitting behind a proxy.
#                                             # Omit to derive it from the bound address.
#                                             # Must include http:// or https://.
# max_concurrent_tasks = 4                    # Maximum concurrent agent turns.
#                                             # Excess SendMessage requests fail fast.
#
# # TLS is NOT implemented yet. Leave this alone or set "none": any other value
# # is REJECTED at startup rather than silently served as plaintext. If you need
# # transport encryption today, terminate it at a reverse proxy.
# # tls = "none"
# # tls_cert = "/etc/ssl/cert.pem"            # Rejected today; reserved.
# # tls_key  = "/etc/ssl/key.pem"             # Rejected today; reserved.
#
# # Advertised at /.well-known/agent-card.json. This endpoint is PUBLIC: peers
# # fetch it before they authenticate. Skill names/descriptions are listed;
# # skill instruction bodies are never included.
# [a2a.card]
# name = "HaosGreen"
# description = "Self-hosted Telegram AI assistant"
# version = "1.0.2"
#
# # One block per authorised peer. Each peer needs its own token.
# [a2a.peers.laptop]
# token = "change-me-to-a-long-random-string"
# ip = ["127.0.0.1", "192.168.1.0/24"]        # Exact IPs or CIDR blocks. Empty = nobody.
# # tools is OPTIONAL. Omit it for the safe default allowlist:
# #   read_file, list_files, read_skill_file, read_agent_file,
# #   search_memory, recall, remember
# # That default deliberately EXCLUDES execute_command, write_file, send_file,
# # self_upgrade, schedule_task, update_soul_file, read_soul_file, plan_view and
# # everything else. read_soul_file is excluded because it can read
# # ~/.haos-green/config.toml, which holds your API key and every peer token.
# #
# # tools = ["read_file", "search_memory"]    # Explicit list, used verbatim.
# # tools = []                                # Grant nothing.
# # tools = ["*"]                             # EVERY tool, INCLUDING shell.
#                                             # Only as the sole entry, and only
#                                             # if you truly mean it.
#
# # Configuration is validated at startup, and the listener refuses to start if
# # anything is wrong: duplicate tokens across peers, an empty token, an empty
# # `ip` list, or an entry that is neither an IP nor a CIDR block. The Telegram
# # bot still starts; only the A2A listener is skipped, with the reason logged.
# # Binding to a non-loopback address logs a warning but is allowed, because
# # raising the bind is meant to be a deliberate act.
#
# NOTE ON `bind` AND THE ADVERTISED URL: without `public_url`, the Agent Card
# advertises the address the listener actually bound. That is correct for
# loopback, but a remote peer cannot use `http://0.0.0.0:8443` -- it resolves to
# the *peer's own* loopback. So set `public_url` whenever you bind to 0.0.0.0 or
# run behind a reverse proxy; startup warns when the derived URL looks unusable.
#
# ── Outbound A2A Client Peers (optional) ────────────────────────────────────
#
# Allows HaosGreen to call remote A2A agents via the `call_a2a_agent` tool.
# If no outbound peers are configured, the tool remains unregistered in the
# agent tool registry.
#
# [a2a.outbound.peers.researcher]
# url = "http://192.168.1.51:8443"            # Remote agent base URL (http:// or https://)
# token = "remote-peer-bearer-token"          # Bearer token for remote authentication
# timeout_secs = 30                           # HTTP request timeout in seconds (default: 30)
# poll_interval_ms = 250                      # Polling interval in ms when awaiting async tasks (default: 250)
# poll_timeout_secs = 60                      # Maximum duration to wait for task completion (default: 60)

# ── Web Dashboard (optional) ────────────────────────────────────────────────
#
# An embedded dashboard with chat, supervisor, log, and A2A views.
#
# SECURITY: an authenticated dashboard user runs the same agent as the Telegram
# operator, including shell execution. It ships DISABLED, binds to loopback,
# and starts with the password `admin`/`admin`. Change the password in the
# dashboard Settings page before exposing the port to anything.
#
# There is no password or token key here on purpose: the dashboard credentials
# are persisted in `<home>/web-auth.toml` (mode 0600), never in this file.
#
# [web]
# enabled = false
# bind = "127.0.0.1:8787"
# public_url = ""            # e.g. "https://haos.example.com"
#                            # https here adds `Secure` to the session cookie.
#                            # Leave it unset (or empty, which is treated the
#                            # same) and the cookie has NO Secure flag, even
#                            # behind a TLS proxy. It is also the host the
#                            # dashboard answers to: a request whose Host header
#                            # is neither this host nor the bound address (nor
#                            # localhost / 127.0.0.1 / [::1] on the bound port)
#                            # is refused with 403, so a non-loopback bind that
#                            # is reached by name must set this.
# session_ttl_hours = 12
# allow_ips = []             # empty = any source IP; non-empty = strict allowlist
#                            # entries may be single IPs or CIDR ranges
#
# WARNING — allow_ips, read this before setting it:
#
#  * The list is enforced before authentication, on every route including the
#    login page and the static assets. A source outside it gets 403 and nothing
#    else. That includes bearer-token callers: the IP gate runs BEFORE bearer
#    auth, so a valid token from a non-listed address is still refused.
#  * A non-empty list can lock YOU out. If you save one from the dashboard that
#    does not cover the address you are browsing from, the next request — the
#    one that would fix it — is the one that gets 403, and the dashboard is
#    unreachable until the process restarts and reloads this file.
#  * Editing the list from the dashboard (`PUT /api/settings/allow-ips`) is
#    IN-MEMORY ONLY. It does not rewrite this file, so a restart restores
#    whatever is written here. To make a change permanent, edit this file.
#  * Entries are matched by address family: an IPv4 rule never matches an IPv6
#    source and vice versa, so `::/0` does not admit an IPv4 client.
