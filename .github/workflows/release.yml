name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: haos-green
            archive_name: haos-green-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: haos-green
            archive_name: haos-green-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: haos-green.exe
            archive_name: haos-green-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Invalid service action prints usage without reading credentials.
      - name: Verify native binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          file "$binary"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) file "$binary" | grep -E 'ELF 64-bit.*x86-64' ;;
            aarch64-apple-darwin) file "$binary" | grep -E 'Mach-O 64-bit.*arm64' ;;
            x86_64-pc-windows-msvc) file "$binary" | grep -E 'PE32\+.*x86-64' ;;
          esac
          set +e
          output=$("$binary" --service __release_smoke__ 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'Usage: haos-green --service'

      - name: Stage release files
        shell: bash
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} staging/
          cp config.example.toml staging/
          cp scripts/install.sh staging/
          cp -r scripts/services staging/services
          # Only for Windows
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp scripts/services/install-service.bat.template staging/install-service.bat
            cp scripts/services/uninstall-service.bat.template staging/uninstall-service.bat
          fi

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive_name }} -C staging .

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path staging\* -DestinationPath ${{ matrix.archive_name }}

      - name: Build .deb package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/haos-green dist/
          TARGET=${{ matrix.target }} ./scripts/build-deb.sh

      - name: Checksum archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum '${{ matrix.archive_name }}' > '${{ matrix.archive_name }}.sha256'
          else
            shasum -a 256 '${{ matrix.archive_name }}' > '${{ matrix.archive_name }}.sha256'
          fi

      - name: Checksum archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = '${{ matrix.archive_name }}'
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
            dist/*.deb
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
